name: raw-cdn-cache probe (plumber#618)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # Only an action.yaml: the raw action.yml 404 makes Plumber ask the
      # contents API, which accepts the token before the probe is read.
      - uses: getplumber-examples/cli-working-lab/raw-cache-yaml@618-raw-cdn-cache
      # Its action.yml is pushed after its raw URL has been asked once.
      - uses: getplumber-examples/cli-working-lab/raw-cache-probe@618-raw-cdn-cache
      # Round 2: its raw 404 was seeded with the headers Plumber sends.
      - uses: getplumber-examples/cli-working-lab/raw-cache-probe2@618-raw-cdn-cache
      # Round 3: checks the fix (a raw miss on a branch asks the API).
      - uses: getplumber-examples/cli-working-lab/raw-cache-probe4@618-raw-cdn-cache
      # Round 4: checks the GraphQL entrypoint prefetch.
      - uses: getplumber-examples/cli-working-lab/raw-cache-probe5@618-raw-cdn-cache
