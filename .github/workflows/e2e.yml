    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: 0x10
  d-off-omitted:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/off@592-disabled-run
  d-off-true:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/off@592-disabled-run
        with:
          flag: 'true'
  d-off-null:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/off@592-disabled-run
        with:
