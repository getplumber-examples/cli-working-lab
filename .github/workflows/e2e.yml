    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/forward@592-disabled-run
        with:
          outer: 'true'
  n-forward-none:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/forward@592-disabled-run
  n-literal:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/literal@592-disabled-run
  p-same-job:
    runs-on: ubuntu-latest
    steps:
      - name: off
        uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: false
      - name: enabled
        uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: 'true'
