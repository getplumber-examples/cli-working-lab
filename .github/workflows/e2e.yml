  c-or-miss:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/ormode@592-disabled-run
        with:
          flag: z
          mode: z
  c-always:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/always@592-disabled-run
        with:
