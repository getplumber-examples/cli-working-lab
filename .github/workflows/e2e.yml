  c-wrapped:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/wrapped@592-disabled-run
        with:
          flag: false
  s-second:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/second@592-disabled-run
        with:
          flag: false
  s-nextline:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/nextline@592-disabled-run
        with:
          flag: false
  s-two-a:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/twoguards@592-disabled-run
        with:
