name: e2e
on:
  push:
    branches: [592-disabled-run]
permissions: {}
jobs:
  v-false:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: false
  v-qfalse:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: 'false'
  v-False:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: False
  v-FALSE:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: FALSE
  v-keycase:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          FLAG: false
  v-no:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: no
  v-off:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: off
  v-n:
