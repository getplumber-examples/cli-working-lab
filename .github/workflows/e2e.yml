      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: 'true'
  v-omitted:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
  v-null:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag:
  v-expr:
    runs-on: ubuntu-latest
    steps:
      - uses: getplumber-examples/cli-working-lab/.github/actions/on@592-disabled-run
        with:
          flag: ${{ github.ref }}
  v-num10:
    runs-on: ubuntu-latest
    steps:
